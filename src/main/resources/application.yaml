spring:
  application:
    name: whatsapp-engine
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://ep-polished-bird-abf8n5px-pooler.eu-west-2.aws.neon.tech/whatsapp-engine?user=neondb_owner&password=npg_8cySMrfDQkq5&sslmode=require&channelBinding=require
    username: neondb_owner
    password: npg_8cySMrfDQkq5
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api/v1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  api:
    version: v1
  campaigns:
    scheduler-delay-ms: ${CAMPAIGN_SCHEDULER_DELAY_MS:60000}
  audit:
    enabled: ${AUDIT_LOGGING_ENABLED:true}
  pagination:
    default-page-size: ${DEFAULT_PAGE_SIZE:20}
    max-page-size: ${MAX_PAGE_SIZE:100}
    one-indexed-parameters: ${ONE_INDEXED_PAGE_PARAMETERS:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
    excluded-paths:
      - /health
      - /actuator/health
      - /v3/api-docs
      - /swagger-ui
  meta:
    whatsapp:
      base-url: ${META_WHATSAPP_BASE_URL:https://graph.facebook.com}
      api-version: ${META_WHATSAPP_API_VERSION:v25.0}
      webhook-verify-token: ${META_WHATSAPP_WEBHOOK_VERIFY_TOKEN:change-this-webhook-token}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
      issuer: ${JWT_ISSUER:protolyte-whatsapp-engine}
      secret: ${JWT_SECRET:change-this-development-secret-change-in-production}
      expiration: ${JWT_EXPIRATION:3600000}

logging:
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%5p service=${spring.application.name} correlationId=%X{correlationId:-} thread=%t logger=%logger{36} msg=%m%n%wEx"
  level:
    root: INFO
    com.whatsapp.engine: ${APP_LOG_LEVEL:INFO}

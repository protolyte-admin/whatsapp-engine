services:
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp-engine-postgres
    environment:
      POSTGRES_DB: whatsapp_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: whatsapp-engine-app
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/whatsapp_engine
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
